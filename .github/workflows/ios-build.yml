name: iOS IPA Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Verify Certificate
        run: |
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision

          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(
            security cms -D -i "$PROFILE_PATH" \
            | plutil -extract UUID raw -o - -
          )

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Verify Installed Profiles
        run: |
          echo "Installed Profiles:"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Dump Provisioning Profile
        run: |
          PROFILE=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)

          echo "Using Profile: $PROFILE"

          security cms -D -i "$PROFILE" > profile.plist

          echo "===== PROFILE NAME ====="
          grep -A1 "<key>Name</key>" profile.plist || true

          echo "===== PROFILE UUID ====="
          grep -A1 "<key>UUID</key>" profile.plist || true

          echo "===== TEAM IDENTIFIER ====="
          grep -A3 "<key>TeamIdentifier</key>" profile.plist || true

          echo "===== APPLICATION IDENTIFIER ====="
          grep -A5 "application-identifier" profile.plist || true

      - name: Show Build Settings
        run: |
          xcodebuild \
            -project ToDos.xcodeproj \
            -scheme ToDos \
            -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM|CODE_SIGN"

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Build Archive
        run: |
          xcodebuild clean archive \
            -project ToDos.xcodeproj \
            -scheme ToDos \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ToDos.xcarchive \
            DEVELOPMENT_TEAM=27JX9JH9ZM \
            PRODUCT_BUNDLE_IDENTIFIER=com.swiftiedev.ToDoApp

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ToDos.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export

      - name: Verify IPA
        run: |
          echo "Exported Files:"
          ls -lah build/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ToDos-IPA
          path: build/export/*.ipa
