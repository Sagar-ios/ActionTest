name: iOS IPA Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild clean archive \
          -project ToDos.xcodeproj \
          -scheme ToDos \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath build/ToDos.xcarchive \
          CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          echo "Searching for .app file..."

          find build/ToDos.xcarchive

          APP_PATH=$(find build/ToDos.xcarchive -type d -name "*.app" | head -1)

          echo "APP_PATH=$APP_PATH"

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -r ToDos.ipa Payload

          echo "IPA Details:"
          ls -lh ToDos.ipa

      - name: Verify IPA
        run: |
          ls -la
          file ToDos.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ToDos-IPA
          path: ToDos.ipa
