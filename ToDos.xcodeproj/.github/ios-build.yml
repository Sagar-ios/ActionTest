name: iOS IPA Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Clean Build
        run: |
          xcodebuild clean build \
          -project ToDos.xcodeproj \
          -scheme ToDos \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          ONLY_ACTIVE_ARCH=NO

      - name: Find App
        run: |
          echo "Searching for iphoneos app..."
          
          find ~/Library/Developer/Xcode/DerivedData \
          -path "*Release-iphoneos*" \
          -name "*.app"

      - name: Inspect App
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
          -path "*Release-iphoneos*" \
          -name "ToDos.app" | head -1)

          echo "APP_PATH=$APP_PATH"

          ls -la "$APP_PATH"

          du -sh "$APP_PATH"

          find "$APP_PATH"

      - name: Create IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
          -path "*Release-iphoneos*" \
          -name "ToDos.app" | head -1)

          echo "Using app:"
          echo "$APP_PATH"

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/

          zip -r ToDos.ipa Payload

          echo "IPA Details:"
          ls -lh ToDos.ipa

      - name: Verify IPA
        run: |
          ls -la
          file ToDos.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ToDos-IPA
          path: ToDos.ipa
