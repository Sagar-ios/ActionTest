name: iOS IPA Build

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:

    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build App
        run: |
          xcodebuild \
          -project ToDos.xcodeproj \
          -scheme ToDos \
          -configuration Release \
          -sdk iphoneos \
          -destination generic/platform=iOS \
          build

      - name: Find App
        run: |
          find ~/Library/Developer/Xcode/DerivedData -name "*.app"

      - name: Create IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ToDos.app" | head -1)

          echo "APP_PATH=$APP_PATH"

          mkdir Payload

          cp -R "$APP_PATH" Payload/

          zip -r ToDos.ipa Payload

          ls -lh ToDos.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ToDos-IPA
          path: ToDos.ipa
